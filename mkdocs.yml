site_name: PlatformFoundry
site_description: Cloud-native platform orchestration framework
site_url: https://platformfoundry.github.io/platformfoundry-ce
repo_url: https://github.com/platformfoundry/pf-ce
repo_name: platformfoundry/platformfoundry-ce

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Guides:
      - Platforms: guides/platforms.md
      - Environments: guides/environments.md
      - Secrets Management: guides/secrets.md
      - GitOps: guides/gitops.md
      - Policies: guides/policies.md
      - Plugins: guides/plugins.md
  - Reference:
      - CLI Commands: reference/cli.md
      - Configuration: reference/config.md
      - API: reference/api.md
  - Tutorials:
      - Your First Platform: tutorials/first-platform.md
      - Multi-Cloud Setup: tutorials/multi-cloud.md
      - CI/CD Integration: tutorials/cicd.md
  - Enterprise:
      - Overview: enterprise/overview.md
      - SSO: enterprise/sso.md
      - Cost Tracking: enterprise/cost-tracking.md
      - DORA Metrics: enterprise/dora.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/platformfoundry
  version:
    provider: mike
