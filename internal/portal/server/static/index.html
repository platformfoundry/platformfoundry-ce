<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlatformFoundry Portal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .sidebar { transition: width 0.3s ease; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-running { background-color: #10b981; }
        .status-failed { background-color: #ef4444; }
        .status-pending { background-color: #f59e0b; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        // API Client
        const api = {
            async get(path) {
                const res = await fetch(`/api/v1${path}`);
                return res.json();
            },
            async post(path, data) {
                const res = await fetch(`/api/v1${path}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return res.json();
            }
        };

        // Context
        const AppContext = createContext();

        // Components
        function Sidebar({ currentPage, setCurrentPage }) {
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                { id: 'environments', label: 'Environments', icon: '🌍' },
                { id: 'workloads', label: 'Workloads', icon: '📦' },
                { id: 'deployments', label: 'Deployments', icon: '🚀' },
                { id: 'resources', label: 'Resources', icon: '🗄️' },
                { id: 'catalog', label: 'Catalog', icon: '📚' },
                { id: 'metrics', label: 'Metrics', icon: '📈' },
            ];

            return (
                <div className="sidebar w-64 bg-gray-800 h-screen fixed left-0 top-0 flex flex-col">
                    <div className="p-4 border-b border-gray-700">
                        <h1 className="text-xl font-bold text-blue-400">PlatformFoundry</h1>
                        <p className="text-xs text-gray-500">Internal Developer Platform</p>
                    </div>
                    <nav className="flex-1 p-4">
                        {navItems.map(item => (
                            <button
                                key={item.id}
                                onClick={() => setCurrentPage(item.id)}
                                className={`w-full text-left px-4 py-3 rounded-lg mb-2 flex items-center gap-3 transition-colors ${
                                    currentPage === item.id
                                        ? 'bg-blue-600 text-white'
                                        : 'text-gray-300 hover:bg-gray-700'
                                }`}
                            >
                                <span>{item.icon}</span>
                                <span>{item.label}</span>
                            </button>
                        ))}
                    </nav>
                    <div className="p-4 border-t border-gray-700">
                        <div className="flex items-center gap-2">
                            <div className="status-dot status-running"></div>
                            <span className="text-sm text-gray-400">Connected</span>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard() {
            const [metrics, setMetrics] = useState(null);
            const [costs, setCosts] = useState(null);

            useEffect(() => {
                api.get('/metrics/dora').then(setMetrics);
                api.get('/metrics/costs').then(setCosts);
            }, []);

            return (
                <div>
                    <h2 className="text-2xl font-bold mb-6">Dashboard</h2>

                    {/* DORA Metrics */}
                    <div className="grid grid-cols-4 gap-4 mb-8">
                        {metrics && Object.entries(metrics).map(([key, data]) => (
                            <div key={key} className="bg-gray-800 rounded-lg p-4">
                                <h3 className="text-sm text-gray-400 capitalize">{key.replace(/([A-Z])/g, ' $1')}</h3>
                                <p className="text-2xl font-bold mt-2">{data.value} <span className="text-sm text-gray-500">{data.unit}</span></p>
                                <span className={`text-xs px-2 py-1 rounded ${
                                    data.rating === 'elite' ? 'bg-green-600' :
                                    data.rating === 'high' ? 'bg-blue-600' : 'bg-yellow-600'
                                }`}>{data.rating}</span>
                            </div>
                        ))}
                    </div>

                    {/* Cost Overview */}
                    {costs && (
                        <div className="bg-gray-800 rounded-lg p-6">
                            <h3 className="text-lg font-semibold mb-4">Cost Overview</h3>
                            <div className="flex items-center gap-4 mb-4">
                                <span className="text-3xl font-bold">${costs.total.toLocaleString()}</span>
                                <span className={`text-sm ${costs.trend < 0 ? 'text-green-400' : 'text-red-400'}`}>
                                    {costs.trend > 0 ? '+' : ''}{costs.trend}% vs last month
                                </span>
                            </div>
                            <div className="grid grid-cols-4 gap-4">
                                {Object.entries(costs.byTeam).map(([team, amount]) => (
                                    <div key={team} className="bg-gray-700 rounded p-3">
                                        <span className="text-sm text-gray-400 capitalize">{team}</span>
                                        <p className="text-lg font-semibold">${amount.toLocaleString()}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function Environments() {
            const [environments, setEnvironments] = useState([]);

            useEffect(() => {
                api.get('/environments').then(data => setEnvironments(data.items || []));
            }, []);

            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold">Environments</h2>
                        <button className="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg">
                            + New Environment
                        </button>
                    </div>
                    <div className="grid grid-cols-3 gap-4">
                        {environments.map(env => (
                            <div key={env.name} className="bg-gray-800 rounded-lg p-4">
                                <div className="flex items-center justify-between mb-2">
                                    <h3 className="font-semibold">{env.name}</h3>
                                    <div className={`status-dot ${env.status === 'active' ? 'status-running' : 'status-pending'}`}></div>
                                </div>
                                <p className="text-sm text-gray-400">Type: {env.type}</p>
                                <p className="text-sm text-gray-400">Cluster: {env.cluster}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Workloads() {
            const [workloads, setWorkloads] = useState([]);

            useEffect(() => {
                api.get('/workloads').then(data => setWorkloads(data.items || []));
            }, []);

            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold">Workloads</h2>
                        <button className="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg">
                            + Deploy Workload
                        </button>
                    </div>
                    <div className="bg-gray-800 rounded-lg overflow-hidden">
                        <table className="w-full">
                            <thead className="bg-gray-700">
                                <tr>
                                    <th className="text-left p-4">Name</th>
                                    <th className="text-left p-4">Environment</th>
                                    <th className="text-left p-4">Status</th>
                                    <th className="text-left p-4">Replicas</th>
                                    <th className="text-left p-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {workloads.map(w => (
                                    <tr key={w.name} className="border-t border-gray-700">
                                        <td className="p-4 font-medium">{w.name}</td>
                                        <td className="p-4 text-gray-400">{w.environment}</td>
                                        <td className="p-4">
                                            <span className="flex items-center gap-2">
                                                <div className={`status-dot ${w.status === 'Running' ? 'status-running' : 'status-pending'}`}></div>
                                                {w.status}
                                            </span>
                                        </td>
                                        <td className="p-4">{w.readyReplicas}/{w.replicas}</td>
                                        <td className="p-4">
                                            <button className="text-blue-400 hover:text-blue-300 mr-3">Logs</button>
                                            <button className="text-blue-400 hover:text-blue-300 mr-3">Shell</button>
                                            <button className="text-blue-400 hover:text-blue-300">Deploy</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function Deployments() {
            const [deployments, setDeployments] = useState([]);

            useEffect(() => {
                api.get('/deployments').then(data => setDeployments(data.items || []));
            }, []);

            const getStatusColor = (status) => {
                switch (status) {
                    case 'succeeded': return 'status-running';
                    case 'failed': return 'status-failed';
                    default: return 'status-pending';
                }
            };

            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold">Deployments</h2>
                    </div>
                    <div className="bg-gray-800 rounded-lg overflow-hidden">
                        <table className="w-full">
                            <thead className="bg-gray-700">
                                <tr>
                                    <th className="text-left p-4">ID</th>
                                    <th className="text-left p-4">Workload</th>
                                    <th className="text-left p-4">Environment</th>
                                    <th className="text-left p-4">Version</th>
                                    <th className="text-left p-4">Status</th>
                                    <th className="text-left p-4">Started</th>
                                    <th className="text-left p-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {deployments.map(d => (
                                    <tr key={d.id} className="border-t border-gray-700">
                                        <td className="p-4 font-mono text-sm">{d.id}</td>
                                        <td className="p-4">{d.workload}</td>
                                        <td className="p-4 text-gray-400">{d.environment}</td>
                                        <td className="p-4">{d.version}</td>
                                        <td className="p-4">
                                            <span className="flex items-center gap-2">
                                                <div className={`status-dot ${getStatusColor(d.status)}`}></div>
                                                {d.status}
                                            </span>
                                        </td>
                                        <td className="p-4 text-gray-400">{new Date(d.startedAt).toLocaleString()}</td>
                                        <td className="p-4">
                                            <button className="text-blue-400 hover:text-blue-300 mr-3">Logs</button>
                                            <button className="text-red-400 hover:text-red-300">Rollback</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function Resources() {
            const [resources, setResources] = useState([]);

            useEffect(() => {
                api.get('/resources').then(data => setResources(data.items || []));
            }, []);

            const getTypeIcon = (type) => {
                const icons = {
                    'postgres': '🐘',
                    'redis': '🔴',
                    'sqs': '📨',
                    's3': '📁'
                };
                return icons[type] || '📦';
            };

            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold">Resources</h2>
                        <button className="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg">
                            + Provision Resource
                        </button>
                    </div>
                    <div className="grid grid-cols-3 gap-4">
                        {resources.map(r => (
                            <div key={r.name} className="bg-gray-800 rounded-lg p-4">
                                <div className="flex items-center gap-3 mb-3">
                                    <span className="text-2xl">{getTypeIcon(r.type)}</span>
                                    <div>
                                        <h3 className="font-semibold">{r.name}</h3>
                                        <p className="text-sm text-gray-400">{r.type}</p>
                                    </div>
                                </div>
                                <div className="flex justify-between text-sm">
                                    <span className="text-gray-400">Provider: {r.provider}</span>
                                    <span className={`flex items-center gap-1 ${r.status === 'available' ? 'text-green-400' : 'text-yellow-400'}`}>
                                        <div className={`status-dot ${r.status === 'available' ? 'status-running' : 'status-pending'}`}></div>
                                        {r.status}
                                    </span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Catalog() {
            const [templates, setTemplates] = useState([]);

            useEffect(() => {
                api.get('/catalog/templates').then(data => setTemplates(data.items || []));
            }, []);

            const getCategoryColor = (category) => {
                const colors = {
                    'backend': 'bg-purple-600',
                    'frontend': 'bg-blue-600',
                    'data': 'bg-green-600'
                };
                return colors[category] || 'bg-gray-600';
            };

            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold">Service Catalog</h2>
                    </div>
                    <div className="grid grid-cols-3 gap-4">
                        {templates.map(t => (
                            <div key={t.name} className="bg-gray-800 rounded-lg p-4 hover:bg-gray-750 cursor-pointer transition-colors">
                                <div className="flex items-center justify-between mb-3">
                                    <span className={`text-xs px-2 py-1 rounded ${getCategoryColor(t.category)}`}>{t.category}</span>
                                </div>
                                <h3 className="font-semibold mb-2">{t.name}</h3>
                                <p className="text-sm text-gray-400 mb-4">{t.description}</p>
                                <button className="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded text-sm">
                                    Use Template
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Metrics() {
            const [metrics, setMetrics] = useState(null);

            useEffect(() => {
                api.get('/metrics/dora').then(setMetrics);
            }, []);

            return (
                <div>
                    <h2 className="text-2xl font-bold mb-6">DORA Metrics</h2>
                    {metrics && (
                        <div className="grid grid-cols-2 gap-6">
                            {Object.entries(metrics).map(([key, data]) => (
                                <div key={key} className="bg-gray-800 rounded-lg p-6">
                                    <h3 className="text-lg font-semibold capitalize mb-4">{key.replace(/([A-Z])/g, ' $1')}</h3>
                                    <div className="flex items-end gap-4">
                                        <span className="text-4xl font-bold">{data.value}</span>
                                        <span className="text-gray-400 pb-1">{data.unit}</span>
                                    </div>
                                    <div className="mt-4">
                                        <div className="h-2 bg-gray-700 rounded-full overflow-hidden">
                                            <div
                                                className={`h-full ${
                                                    data.rating === 'elite' ? 'bg-green-500' :
                                                    data.rating === 'high' ? 'bg-blue-500' : 'bg-yellow-500'
                                                }`}
                                                style={{ width: data.rating === 'elite' ? '100%' : data.rating === 'high' ? '75%' : '50%' }}
                                            ></div>
                                        </div>
                                        <p className="text-sm text-gray-400 mt-2">Performance: <span className="capitalize">{data.rating}</span></p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [currentPage, setCurrentPage] = useState('dashboard');

            const renderPage = () => {
                switch (currentPage) {
                    case 'dashboard': return <Dashboard />;
                    case 'environments': return <Environments />;
                    case 'workloads': return <Workloads />;
                    case 'deployments': return <Deployments />;
                    case 'resources': return <Resources />;
                    case 'catalog': return <Catalog />;
                    case 'metrics': return <Metrics />;
                    default: return <Dashboard />;
                }
            };

            return (
                <div className="flex">
                    <Sidebar currentPage={currentPage} setCurrentPage={setCurrentPage} />
                    <main className="ml-64 flex-1 p-8">
                        {renderPage()}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
