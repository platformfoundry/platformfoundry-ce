# Example Workload Specification
# A workload is a developer-friendly abstraction that defines an application
# without requiring infrastructure knowledge
apiVersion: platformfoundry.io/v1
kind: Workload
metadata:
  name: order-service
  team: orders
  environment: production
  labels:
    tier: backend
    criticality: high
spec:
  # Container definitions
  containers:
    - name: api
      image: order-service:v1.2.3
      resources:
        cpu: 500m
        memory: 512Mi
      ports:
        - name: http
          port: 8080
        - name: metrics
          port: 9090
      env:
        LOG_LEVEL: info
        SERVICE_NAME: order-service
      envFrom:
        - secretRef: order-service-secrets
      livenessProbe:
        httpGet:
          path: /health/live
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /health/ready
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5

  # External dependencies - Platform Foundry provisions these automatically
  dependencies:
    - type: postgres
      name: orders-db
      required: true
      config:
        size: medium
        version: "15"
        backup: daily
        multi_az: true

    - type: redis
      name: orders-cache
      required: false
      config:
        size: small

    - type: kafka
      name: order-events
      config:
        topics:
          - orders.created
          - orders.updated
          - orders.shipped

  # Auto-scaling configuration
  scaling:
    min: 2
    max: 10
    targetCPU: 70
    targetMem: 80

  # Networking configuration
  network:
    ingress:
      enabled: true
      path: /api/orders
      host: api.example.com
      tls: true
      annotations:
        kubernetes.io/ingress.class: nginx
        cert-manager.io/cluster-issuer: letsencrypt-prod
    service:
      type: ClusterIP
    policies:
      - allowFrom:
          - payment-service
          - user-service
      - allowTo:
          - notification-service

  # Environment-specific overrides
  environments:
    staging:
      replicas: 1
      resources:
        cpu: 250m
        memory: 256Mi
      scaling:
        min: 1
        max: 3
    production:
      replicas: 3
      scaling:
        min: 3
        max: 20

  # Lifecycle hooks
  lifecycle:
    preDeploy:
      command: ["./scripts/migrate.sh"]
      timeout: 300
    postDeploy:
      command: ["./scripts/warmup.sh"]
      timeout: 60
