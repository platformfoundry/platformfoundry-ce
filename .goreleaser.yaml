# Platform Foundry CE GoReleaser Configuration
# https://goreleaser.com
version: 2

project_name: pf

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: pf
    main: ./cmd/pf
    binary: pf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/platformfoundry/pf-ce/internal/version.Version={{.Version}}
      - -X github.com/platformfoundry/pf-ce/internal/version.Commit={{.Commit}}
      - -X github.com/platformfoundry/pf-ce/internal/version.Date={{.Date}}
      - -X github.com/platformfoundry/pf-ce/internal/version.BuiltBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"

signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Security
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs?(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: platformfoundry
    name: platformfoundry-ce
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Platform Foundry CE {{ .Version }}

    ### Installation

    **macOS (Homebrew):**
    ```bash
    brew install platformfoundry/tap/pf
    ```

    **Linux/macOS (curl):**
    ```bash
    curl -sSfL https://raw.githubusercontent.com/platformfoundry/platformfoundry-ce/main/install.sh | sh
    ```

    **Windows (Scoop):**
    ```powershell
    scoop bucket add platformfoundry https://github.com/platformfoundry/scoop-bucket.git
    scoop install pf
    ```

    ### Verifying Signatures

    All release artifacts are signed with cosign. To verify:
    ```bash
    cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig checksums.txt
    ```
  footer: |
    **Full Changelog**: https://github.com/platformfoundry/pf-ce/compare/{{ .PreviousTag }}...{{ .Tag }}

snapshot:
  version_template: "{{ incpatch .Version }}-next"

